services:
  - type: web
    name: wind-monitoring-system
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: wind-db
          property: connectionString
    autoDeploy: true

databases:
  - name: wind-db
    plan: free
    region: oregon
